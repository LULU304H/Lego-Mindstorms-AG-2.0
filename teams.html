<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B1120">
<title>Mindstorms Arena</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="js/config.js"></script>
<script src="js/app.js"></script>
<script>
(async function () {
  if (!window.Arena) return;
  const A = window.Arena, sb = A.sb, esc = A.esc;
  const view = await A.mount('teams', { title: 'Teams' });
  if (!view) return;
  if (!A.on('teams')) { view.innerHTML = '<p class="empty">Die Teams sind gerade ausgeschaltet.</p>'; return; }
  view.innerHTML = '<h1 class="pg-h">Teams</h1><div id="ls"><div class="sk" style="height:84px"></div></div>';
  const r = await sb.from('teams').select('id,name,description,color').eq('public_profile', true).order('name'), ls = document.getElementById('ls');
  if (r.error) { A.fail(r.error, 'Teams laden'); ls.innerHTML = '<div class="empty">Die Teams konnten nicht geladen werden. Lade die Seite neu.</div>'; return; }
  if (!r.data.length) { ls.innerHTML = '<div class="empty">Noch kein Team hat sein Profil veröffentlicht.</div>'; return; }
  ls.innerHTML = r.data.map(t => '<div class="panel tcard"><i style="background:' + esc(t.color || '#FF8A00') + '"></i><div><h2 style="margin:0 0 4px;font-size:1.2rem">' + esc(t.name) + '</h2><span class="mute">' + esc(t.description || 'Dieses Team hat noch keine Beschreibung.') + '</span></div></div>').join('');
})();
</script>
</body>
</html>

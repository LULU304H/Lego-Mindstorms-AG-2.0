<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B1120">
<title>Mindstorms Arena</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap">
<link rel="stylesheet" href="css/style.css?v=5">
</head>
<body>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="js/config.js?v=5"></script>
<script src="js/app.js?v=5"></script>
<script src="js/tournament.js?v=5"></script>
<script src="js/admin.js?v=5"></script>
<script>
Admin.page('about', 'AG-Infos', {
  table: 'about_sections', order: [['sort_order', true]], newLabel: 'Neuer Abschnitt',
  empty: 'Noch kein Abschnitt. Mit „Neuer Abschnitt“ schreibst du, was Besucher über die AG wissen sollen.',
  name: r => r.title, defaults: { sort_order: 0 },
  fields: [
    { k: 'title', label: 'Titel', req: 1, list: 1 }, { k: 'text', label: 'Text', type: 'textarea' },
    { k: 'icon', label: 'Symbol', hint: 'Ein Emoji, zum Beispiel 🛠️' }, { k: 'sort_order', label: 'Reihenfolge (kleine Zahl zuerst)', type: 'number', list: 1 }
  ]
});
</script>
</body>
</html>

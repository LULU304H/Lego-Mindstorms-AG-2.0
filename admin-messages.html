<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B1120">
<title>Mindstorms Arena</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap">
<link rel="stylesheet" href="css/style.css?v=5">
</head>
<body>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="js/config.js?v=5"></script>
<script src="js/app.js?v=5"></script>
<script src="js/admin.js?v=5"></script>
<script>
(async function () {
  if (!window.Arena) return;
  const A = window.Arena, sb = A.sb, esc = A.esc, q = Admin.q;
  const view = await A.mount('messages', { title: 'Nachrichten', admin: true });
  if (!view) return;
  let teams = [], msgs = [];
  try { teams = await q(sb.from('teams').select('id,name').order('name')); } catch (e) { A.fail(e, 'Teams laden'); }
  view.innerHTML = '<h1 class="pg-h">Nachrichten</h1><form id="nf" style="max-width:560px"><label class="fld"><span>An</span><select id="to"><option value="">Alle (öffentliche Nachricht)</option>' + teams.map(t => '<option value="' + t.id + '">' + esc(t.name) + '</option>').join('') + '</select></label>' +
    '<label class="fld"><span>Betreff</span><input id="sub" type="text" maxlength="120"></label><label class="fld"><span>Nachricht</span><textarea id="body" rows="3" maxlength="2000" required></textarea></label><p class="form-msg" id="nm" role="alert" hidden></p><button class="btn pri" type="submit">Senden</button></form><h2 class="sec2">Verlauf</h2><div id="ls"></div>';
  const ls = document.getElementById('ls');
  const draw = () => { ls.innerHTML = msgs.length ? '<div class="msgs">' + msgs.map((m, i) => {
    const inb = m.direction === 'TEAM_TO_ADMIN';
    return '<div class="panel"><h3>' + esc(m.subject || 'Nachricht') + ' <span class="chip' + (inb && !m.read ? ' ACTIVE' : '') + '">' + (inb ? 'Von ' + esc(m.team_name || 'Team') + (m.read ? '' : ', neu') : m.broadcast ? 'An alle' : 'An ' + esc(m.team_name || 'Team')) + '</span></h3><span class="mute">' + new Date(m.created_at).toLocaleString('de-DE', { dateStyle: 'medium', timeStyle: 'short' }) + '</span><p>' + esc(m.body) + '</p>' +
      '<div class="acts" style="margin:10px 0 0">' + (inb && !m.read ? '<button class="btn sm" data-r="' + i + '" type="button">Als gelesen markieren</button>' : '') + '<button class="btn sm del" data-d="' + i + '" type="button">Löschen</button></div></div>';
  }).join('') + '</div>' : '<p class="empty">Noch keine Nachrichten.</p>'; };
  const load = async () => { try { msgs = await q(sb.from('messages').select('*').order('created_at', { ascending: false }).limit(200)); draw(); } catch (e) { A.fail(e, 'Nachrichten laden'); ls.innerHTML = '<p class="empty">Die Nachrichten konnten nicht geladen werden: ' + esc(e.message) + '</p>'; } };
  document.getElementById('nf').onsubmit = async e => {
    e.preventDefault();
    const m = document.getElementById('nm'), b = e.target.querySelector('button'), to = document.getElementById('to').value; m.hidden = true; b.disabled = true;
    try {
      const t = teams.find(x => x.id === to);
      await q(sb.from('messages').insert({ direction: 'ADMIN_TO_TEAM', team_id: to || null, team_name: t ? t.name : null, broadcast: !to, sender_name: 'Admin', subject: document.getElementById('sub').value.trim() || null, body: document.getElementById('body').value.trim() }));
      e.target.reset(); A.toast('Nachricht gesendet.'); load();
    } catch (er) { m.textContent = 'Senden hat nicht geklappt: ' + (er.message || er); m.hidden = false; }
    b.disabled = false;
  };
  ls.onclick = async e => {
    const b = e.target.closest('button'); if (!b) return;
    try {
      if (b.dataset.r != null) await q(sb.from('messages').update({ read: true }).eq('id', msgs[+b.dataset.r].id));
      else if (b.dataset.d != null) { if (!confirm('Diese Nachricht löschen?')) return; await q(sb.from('messages').delete().eq('id', msgs[+b.dataset.d].id)); }
      else return;
      load();
    } catch (er) { A.fail(er, 'Aktion'); }
  };
  load();
})();
</script>
</body>
</html>

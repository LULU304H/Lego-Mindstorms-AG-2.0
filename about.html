<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B1120">
<title>Mindstorms Arena</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap">
<link rel="stylesheet" href="css/style.css?v=6">
</head>
<body>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="js/config.js?v=6"></script>
<script src="js/app.js?v=6"></script>
<script src="js/tournament.js?v=6"></script>
<script>
(async function () {
  if (!window.Arena) return;
  const A = window.Arena, sb = A.sb, esc = A.esc;
  const view = await A.mount('about', { title: 'Über die AG' });
  if (!view) return;
  if (!A.on('about')) { view.innerHTML = '<p class="empty">Diese Seite ist gerade ausgeschaltet.</p>'; return; }
  view.innerHTML = '<h1 class="pg-h">Über die AG</h1><div id="ls"><div class="sk" style="height:120px"></div></div>';
  const r = await sb.from('about_sections').select('*').order('sort_order'), ls = document.getElementById('ls');
  if (r.error) { A.fail(r.error, 'AG-Infos laden'); ls.innerHTML = '<div class="empty">Die Infos konnten nicht geladen werden. Lade die Seite neu.</div>'; return; }
  if (!r.data.length) { ls.innerHTML = '<div class="empty">Die AG-Leiter haben hier noch nichts eingetragen.</div>'; return; }
  ls.innerHTML = r.data.map(s => '<div class="panel tcard">' + (s.icon ? '<span class="ico">' + esc(s.icon) + '</span>' : '') + '<div><h2 style="margin:0 0 4px;font-size:1.2rem">' + esc(s.title) + '</h2><span class="mute" style="white-space:pre-wrap">' + esc(s.text || '') + '</span></div></div>').join('');
})();
</script>
</body>
</html>

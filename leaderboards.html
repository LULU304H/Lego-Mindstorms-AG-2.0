<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B1120">
<title>Mindstorms Arena</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap">
<link rel="stylesheet" href="css/style.css?v=5">
</head>
<body>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="js/config.js?v=5"></script>
<script src="js/app.js?v=5"></script>
<script>
(async function () {
  if (!window.Arena) return;
  const A = window.Arena, sb = A.sb, esc = A.esc;
  const view = await A.mount('leaderboards', { title: 'Ranglisten' });
  if (!view) return;
  if (!A.on('leaderboards')) { view.innerHTML = '<p class="empty">Die Ranglisten sind gerade ausgeschaltet. Admins können sie unter „Funktionen“ wieder einschalten.</p>'; return; }
  const T = [['Robot', 'Robot Challenge'], ['Sumo', 'Sumo Challenge'], ['Speed', 'Speed Challenge'], ['Overall', 'Gesamt']];
  let rows = [], cur = 'Robot', failed = false;
  view.innerHTML = '<h1 class="pg-h">Ranglisten</h1><div class="seg" role="group" aria-label="Rangliste wählen">' +
    T.map(t => '<button type="button" data-t="' + t[0] + '">' + t[1] + '</button>').join('') + '</div><section class="panel" id="box" style="margin-top:18px"></section>';
  const box = document.getElementById('box');
  const draw = () => {
    view.querySelectorAll('.seg button').forEach(b => b.setAttribute('aria-pressed', b.dataset.t === cur));
    const list = rows.filter(r => r.leaderboard === cur);
    if (failed) { box.innerHTML = '<div class="empty">Die Ranglisten konnten nicht geladen werden. Lade die Seite neu.</div>'; return; }
    if (!list.length) { box.innerHTML = '<div class="empty">Noch keine Punkte vergeben.</div>'; return; }
    const max = Math.max(1, ...list.map(r => r.points));
    box.innerHTML = '<ol class="lb">' + list.map((r, i) =>
      '<li style="--d:' + i * 60 + 'ms" data-w="' + (r.points / max) + '"><span class="rk">' + (i + 1) + '</span>' +
      '<span>' + esc(r.team_name) + '<small class="wd">' + r.wins + ' Siege, ' + r.draws + ' Unentschieden, ' + r.losses + ' Niederlagen</small></span>' +
      '<span class="pt" data-n="' + r.points + '">0</span></li>').join('') + '</ol>';
    requestAnimationFrame(() => requestAnimationFrame(() => box.querySelectorAll('li').forEach(li => {
      li.style.setProperty('--w', li.dataset.w);
      const pt = li.querySelector('.pt'); A.countUp(pt, Number(pt.dataset.n));
    })));
  };
  view.querySelector('.seg').onclick = e => { const b = e.target.closest('button'); if (b) { cur = b.dataset.t; draw(); } };
  const r = await sb.from('rankings').select('*').order('points', { ascending: false });
  if (r.error) { failed = true; A.fail(r.error, 'Ranglisten laden'); } else rows = r.data;
  draw();
})();
</script>
</body>
</html>

<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mindstorms AG</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=DM+Sans:wght@400;500;700&display=swap">
<link rel="stylesheet" href="css/style.css"></head>
<body><div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script><script src="js/app.js"></script>
<script>
(async () => {
  const A = Arena, { sb, q } = A;
  const wrap = await A.mount({ page: 'leaderboards', title: 'Ranglisten', feature: 'leaderboards' });
  if (!wrap) return;
  const T = ['Robot', 'Sumo', 'Speed', 'Overall'];
  let rows = [], cur = 'Robot', failed = false;
  wrap.innerHTML = '<h1 class="h1">Ranglisten</h1><div class="seg" role="group" aria-label="Rangliste wählen">' +
    T.map(t => '<button type="button" data-t="' + t + '">' + A.typeLabel(t) + '</button>').join('') + '</div><div id="bd" style="margin-top:24px"></div>';
  const draw = () => {
    A.$$('.seg button', wrap).forEach(b => b.setAttribute('aria-pressed', b.dataset.t === cur));
    const bd = A.$('#bd', wrap);
    bd.innerHTML = failed ? '<p class="empty">Die Ranglisten konnten nicht geladen werden. Lade die Seite neu.</p>' : A.board(rows.filter(r => r.leaderboard === cur));
    A.reveal(bd);
  };
  A.$('.seg', wrap).onclick = e => { const b = e.target.closest('button'); if (b) { cur = b.dataset.t; draw(); } };
  try { rows = await q(sb.from('rankings').select('*').order('points', { ascending: false })); }
  catch (e) { failed = true; A.err(e, 'Ranglisten laden'); }
  draw();
})();
</script></body></html>

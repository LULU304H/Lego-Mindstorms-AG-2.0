<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B1120">
<title>Mindstorms Arena</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap">
<link rel="stylesheet" href="css/style.css?v=5">
</head>
<body>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="js/config.js?v=5"></script>
<script src="js/app.js?v=5"></script>
<script src="js/admin.js?v=5"></script>
<script>
const num = (k, label, list) => ({ k: k, label: label, type: 'number', list: list });
Admin.page('rankings', 'Ranglisten', {
  table: 'rankings', order: [['leaderboard', true], ['points', false]], newLabel: 'Punkte eintragen',
  empty: 'Noch keine Punkte vergeben. Lege zuerst unter „Teams“ ein Team an und trage dann hier die Punkte ein.',
  name: r => r.team_name + ' in der Rangliste ' + r.leaderboard,
  defaults: { leaderboard: 'Robot', points: 0, wins: 0, draws: 0, losses: 0 },
  init: async c => {
    const t = await Admin.q(Arena.sb.from('teams').select('id,name').order('name'));
    Admin._teams = {}; t.forEach(x => { Admin._teams[x.id] = x.name; });
    c.fields[1].options = t.map(x => [x.id, x.name]);
  },
  fields: [
    { k: 'leaderboard', label: 'Rangliste', type: 'select', list: 1, options: [['Robot', 'Robot Challenge'], ['Sumo', 'Sumo Challenge'], ['Speed', 'Speed Challenge'], ['Overall', 'Gesamt']] },
    { k: 'team_id', label: 'Team', type: 'select', req: 1, list: 1, options: [] },
    num('points', 'Punkte', 1), num('wins', 'Siege', 1), num('draws', 'Unentschieden', 1), num('losses', 'Niederlagen', 1)
  ],
  before: async rec => {
    if (!rec.team_id) throw new Error('Lege zuerst ein Team an und wähle es dann aus.');
    rec.team_name = Admin._teams[rec.team_id];
  }
});
</script>
</body>
</html>

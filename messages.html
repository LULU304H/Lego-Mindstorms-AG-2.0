<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B1120">
<title>Mindstorms Arena</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap">
<link rel="stylesheet" href="css/style.css?v=5">
</head>
<body>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="js/config.js?v=5"></script>
<script src="js/app.js?v=5"></script>
<script>
(async function () {
  if (!window.Arena) return;
  const A = window.Arena, sb = A.sb, esc = A.esc;
  const view = await A.mount('messages', { title: 'Nachrichten' });
  if (!view) return;
  if (!A.on('messages')) { view.innerHTML = '<p class="empty">Die Nachrichten sind gerade ausgeschaltet.</p>'; return; }
  view.innerHTML = '<h1 class="pg-h">Nachrichten</h1><div id="ls"><div class="sk" style="height:84px"></div></div>';
  const r = await sb.from('messages').select('*').eq('broadcast', true).order('created_at', { ascending: false }).limit(50), ls = document.getElementById('ls');
  if (r.error) { A.fail(r.error, 'Nachrichten laden'); ls.innerHTML = '<div class="empty">Die Nachrichten konnten nicht geladen werden. Lade die Seite neu.</div>'; return; }
  if (!r.data.length) { ls.innerHTML = '<div class="empty">Noch keine Nachrichten von den AG-Leitern.</div>'; return; }
  ls.innerHTML = '<div class="msgs">' + r.data.map(m => '<div class="panel"><h3>' + esc(m.subject || 'Nachricht') + '</h3><span class="mute">' + new Date(m.created_at).toLocaleDateString('de-DE', { day: 'numeric', month: 'long', year: 'numeric' }) + '</span><p>' + esc(m.body) + '</p></div>').join('') + '</div>';
})();
</script>
</body>
</html>
